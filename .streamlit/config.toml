# Tema da PH Consult -- cores tiradas da logo (ver `cores.py`).
[theme]
base = "light"
primaryColor = "#1b3a5c"             # marinho da montanha: botoes e foco
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f0e6" # creme da neve
textColor = "#1b3a5c"
baseRadius = "10px"

[theme.sidebar]
backgroundColor = "#f2f0e6"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b3a5c"
primaryColor = "#ff6f61"             # coral da bandeira: item selecionado

[server]
# PDFs de estrategia costumam ser leves; 20 MB cobre com folga.
maxUploadSize = 20
